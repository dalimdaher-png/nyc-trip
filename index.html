<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NYC Trip 2026</title>
  <meta name="description" content="Tu viaje a Acapulco: vuelos y horarios." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=12" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NYC Trip" />
</head>
<body>
  <div class="app">
    <main class="screens">

      <!-- HOY -->
      <section class="screen is-active" id="hoy" aria-labelledby="hoy-title">
        <header class="sign">
          <h1 id="hoy-title">Hoy</h1>
          <p class="sign-context" id="todayLabel"></p>
        </header>

        <div class="page">
          <div class="hero">
            <div class="hero-text">
              <p class="hero-title">NYC Trip 2026</p>
              <p class="hero-dates">6 al 14 nov</p>
              <p class="hero-places">Acapulco, con la vuelta por Ciudad de México</p>
            </div>
            <p class="hero-status" id="heroStatus"></p>
          </div>

          <section class="board" id="nextBoard" aria-live="polite"></section>

          <div class="stats" id="stats"></div>

          <section class="block" aria-labelledby="weather-title">
            <div class="block-head">
              <h2 id="weather-title">Clima</h2>
              <div class="segmented" role="tablist" aria-label="Ciudad del pronóstico" id="weatherTabs">
                <button type="button" role="tab" data-place="aca" aria-selected="true">Acapulco</button>
              </div>
            </div>
            <div class="weather-days" id="weatherDays"></div>
            <p class="hint" id="weatherStatus">Cargando pronóstico…</p>
          </section>

          <section class="block" aria-labelledby="links-title">
            <div class="block-head"><h2 id="links-title">Accesos rápidos</h2></div>
            <ul class="list" id="quickLinks"></ul>
          </section>
        </div>
      </section>

      <!-- VIAJE -->
      <section class="screen" id="viaje" aria-labelledby="viaje-title">
        <header class="sign">
          <h1 id="viaje-title">Viaje</h1>
          <p class="sign-context">9 días, 2 vuelos, Acapulco</p>
        </header>
        <div class="page" id="tripLine"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Secciones">
      <button type="button" class="tab is-active" data-target="hoy" aria-current="page"><span data-icon="house"></span>Hoy</button>
      <button type="button" class="tab" data-target="viaje"><span data-icon="route"></span>Viaje</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="update-bar" id="updateBar" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button type="button" class="btn btn-small btn-primary" id="updateBtn">Actualizar</button>
  </div>

  <script src="icons.js?v=12"></script>
  <script src="app.js?v=12"></script>
</body>
</html>
